name: Discover podcasts and runner
on: workflow_dispatch
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/discover.py
      - run: python scripts/publish.py discovery discovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
