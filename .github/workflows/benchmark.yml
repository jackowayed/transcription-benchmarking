name: Podcast transcription benchmark
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Repeated trials per configuration
        default: '2'
        required: true
      config_ids:
        description: Comma-separated configuration IDs; blank screens all engines
        default: ''
      corpus_mode:
        description: Samples or complete episodes (original MP3 for Faster Whisper)
        type: choice
        options: [samples, full-mp3, full-wav]
        default: samples
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HF_HUB_DISABLE_XET: '1'
      REPEATS: ${{ inputs.repeats }}
      CONFIG_IDS: ${{ inputs.config_ids }}
      CORPUS_MODE: ${{ inputs.corpus_mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Python engines
        run: pip install -r requirements.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Freeze recent podcast samples
        run: python scripts/stage.py corpus python scripts/corpus.py
      - name: Download models before timed trials
        run: python scripts/stage.py setup-models python scripts/setup_models.py
      - name: Build whisper.cpp
        if: inputs.config_ids == '' || contains(inputs.config_ids, 'cpp-')
        run: |
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper.cpp/build --config Release -j 4
      - name: Run fresh-process trials on two logical CPUs
        run: python scripts/benchmark.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Publish evidence
        if: always()
        run: |
          if test -f outputs/environment.json; then python scripts/report.py; fi
          if test -d outputs; then python scripts/publish.py outputs runs/${GITHUB_RUN_ID}; fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ github.run_id }}
          path: |
            outputs/
            data/manifest.json
            data/*.wav
            data/*.mp3
          retention-days: 30
